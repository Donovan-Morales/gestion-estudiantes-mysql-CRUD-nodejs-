<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Alumnos</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #0056b3; color: white; }
    .btn-back { display: inline-block; margin-top: 15px; color: #6c757d; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Lista de Alumnos Registrados</h2>
    <table>
      <thead>
        <tr><th>Carnet</th><th>Nombres</th><th>Apellidos</th><th>Fecha Nac.</th><th>Carrera</th><th>Correo</th></tr>
      </thead>
      <tbody id="tabla-body"></tbody>
    </table>
    <a href="index.html" class="btn-back">← Volver al Menú</a>
  </div>
  <script>
    async function cargar() {
      const res = await fetch('/api/estudiantes');
      const data = await res.json();
      const body = document.getElementById('tabla-body');
      body.innerHTML = data.map(est => `
        <tr>
          <td>${est.Carnet}</td>
          <td>${est.Nombres}</td>
          <td>${est.Apellidos}</td>
          <td>${est.Fecha_nac || ''}</td>
          <td>${est.Carrera || ''}</td>
          <td>${est.Correo || ''}</td>
        </tr>
      `).join('');
    }
    cargar();
  </script>
</body>
</html>
