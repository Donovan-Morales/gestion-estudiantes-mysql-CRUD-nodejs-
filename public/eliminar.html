<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliminar Alumno</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #dc3545; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-back { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="text-align:center; margin-bottom:15px; color:#dc3545;">Eliminar Alumno</h2>
    <input type="text" id="carnet" placeholder="Ingrese Carnet a eliminar">
    <button onclick="eliminar()">Eliminar Registro</button>
    <a href="index.html" class="btn-back">← Volver al Menú</a>
  </div>
  <script>
    async function eliminar() {
      const carnet = document.getElementById('carnet').value;
      if (!carnet) return alert('Ingrese un carnet');
      if (!confirm(`¿Eliminar alumno ${carnet}?`)) return;

      const res = await fetch(`/api/estudiantes/${carnet}`, { method: 'DELETE' });
      const data = await res.json();
      alert(data.message || data.error);
      if (res.ok) window.location.href = 'index.html';
    }
  </script>
</body>
</html>
