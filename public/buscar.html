<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Alumno</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .resultado { margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; display: none; }
    .btn-back { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="text-align:center; margin-bottom:15px;">Buscar por Carnet</h2>
    <input type="text" id="carnet" placeholder="Ingrese Carnet">
    <button onclick="buscar()">Buscar</button>
    <div id="res" class="resultado"></div>
    <a href="index.html" class="btn-back">← Volver al Menú</a>
  </div>
  <script>
    async function buscar() {
      const carnet = document.getElementById('carnet').value;
      const resDiv = document.getElementById('res');
      const res = await fetch(`/api/estudiantes/${carnet}`);
      if (!res.ok) {
        resDiv.style.display = 'block';
        resDiv.innerHTML = '<p style="color:red;">Alumno no encontrado</p>';
        return;
      }
      const data = await res.json();
      resDiv.style.display = 'block';
      resDiv.innerHTML = `
        <p><strong>Carnet:</strong> ${data.Carnet}</p>
        <p><strong>Nombres:</strong> ${data.Nombres}</p>
        <p><strong>Apellidos:</strong> ${data.Apellidos}</p>
        <p><strong>Fecha Nac:</strong> ${data.Fecha_nac || 'N/A'}</p>
        <p><strong>Carrera:</strong> ${data.Carrera || 'N/A'}</p>
        <p><strong>Correo:</strong> ${data.Correo || 'N/A'}</p>
      `;
    }
  </script>
</body>
</html>
